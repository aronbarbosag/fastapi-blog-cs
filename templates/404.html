{% extends "layout.html" %}
{% block content %}
  <div class="py-5 text-center">
    <div class="mb-4">
        <h1 class="fw-bold display-1 opacity-10" style="letter-spacing: -0.05em;">{{ status_code }}</h1>
    </div>
    
    <div class="mb-5">
        <h2 class="fw-bold h3 mb-3" style="letter-spacing: -0.02em;">Oops... {{ status_code }} Error</h2>
        <p class="text-secondary opacity-75 fs-5 mx-auto" style="max-width: 500px;">
            {{ message }}
        </p>
    </div>

    <div class="mt-5">
        <a href="{{ url_for('home') }}" class="btn btn-outline-minimal px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Voltar para o Início
        </a>
    </div>

    <div class="mt-5 pt-5 opacity-25">
        <i class="bi bi-compass display-4"></i>
    </div>
  </div>
{% endblock content %}
